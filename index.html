<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yarn Inventory</title>
  <style>
    body { font-family: sans-serif; margin: 1rem; color: #222; }
    h1 { text-align: center; }
    button, input { font: inherit; }
    button { cursor: pointer; padding: 0.5rem 0.75rem; min-height: 44px; }
    .toolbar, .collections { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem; }
    .collections { border-bottom: 2px solid #ede8e8; padding-bottom: 0.5rem; }
    .collections button[aria-pressed="true"] { border-color: #9a3535; background: #f8e7e7; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9rem), 1fr)); gap: 1rem; }
    .yarn-card {
      border: 1px solid #ddd;
      padding: 0.625rem;
      text-align: center;
      border-radius: 8px;
      display: grid;
      align-content: start;
      gap: 0.5rem;
    }
    .yarn-card img { width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 6px; }
    .stock { font-weight: bold; }
    .no-stock { background-color: #f8e7e7; }
    dialog { width: min(24rem, calc(100% - 4rem)); border: 1px solid #ddd; border-radius: 8px; }
    dialog::backdrop { background: #0006; }
    form, label { display: grid; gap: 0.5rem; }
    input { box-sizing: border-box; width: 100%; padding: 0.5rem; }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    [role="status"]:empty { display: none; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0"></script>
  <script defer src="./supabase-config.js"></script>
  <script defer src="./inventory.js"></script>
</head>
<body>
  <h1>🧶 Yarn Inventory</h1>
  <div class="toolbar">
    <button id="sort" type="button" aria-pressed="false" disabled>Ordenar por stock</button>
    <button id="account" type="button" hidden>Entrar para editar</button>
  </div>
  <nav id="collections" class="collections" aria-label="Linhas"></nav>
  <p id="status" role="status"></p>
  <div id="inventory" class="grid"></div>

  <dialog id="login-dialog" aria-labelledby="login-title">
    <form id="login-form">
      <h2 id="login-title">Entrar para editar</h2>
      <label>Email <input type="email" name="email" autocomplete="username" required></label>
      <label>Palavra-passe <input type="password" name="password" autocomplete="current-password" required></label>
      <p id="login-message" role="status"></p>
      <div class="dialog-actions">
        <button type="submit">Entrar</button>
        <button type="button" data-close>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="stock-dialog" aria-labelledby="stock-title">
    <form id="stock-form">
      <h2 id="stock-title">Editar stock</h2>
      <label>Quantidade <input type="text" name="quantity" inputmode="decimal" required></label>
      <p id="stock-message" role="status"></p>
      <div class="dialog-actions">
        <button type="submit">Guardar</button>
        <button type="button" data-close>Cancelar</button>
      </div>
    </form>
  </dialog>
</body>
</html>
